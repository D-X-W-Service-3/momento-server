spring:
  datasource:
    url: ${DB_URL}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        dialect.storage_engine: innodb
    show-sql: false
    # 스키마는 Flyway 가 만든다(기동 시 db/migration 의 마이그레이션을 순서대로 적용).
    # validate 는 그 뒤에 엔티티와 실제 테이블이 맞는지 확인만 한다 — 테이블·컬럼·타입만 보고
    # NULL 허용 여부·인덱스·FK 는 검사하지 않으므로, 그 부분은 마이그레이션이 유일한 보장 수단이다.
    hibernate:
      ddl-auto: validate

# 웹 푸시 VAPID 키쌍. application.yml 의 개발용 기본값을 운영에서 쓰지 않도록 기본값 없이 다시 선언한다.
# 환경변수가 빠지면 값이 "${VAPID_...}" 문자열 그대로 남는데, VapidProperties 의 형식 검사가 기동을 막는다.
# 개발용 개인키는 저장소에 공개돼 있어 운영에 쓰이면 안 된다.
push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT}
