spring:
  application:
    name: momento-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
      resolve-lazily: true

  # 로컬·테스트는 H2 를 MySQL 호환 모드로 띄운다. 운영과 같은 마이그레이션 SQL 한 벌을 양쪽에서 돌리기 위해서다.
  datasource:
    url: jdbc:h2:mem:momento;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 시점에 실패한다.
    hibernate:
      ddl-auto: validate

momento:
  capsule:
    # 상태 전이 스케줄러 주기. 공개 시각 정각에 들어온 사용자가 겪는 지연이 이 값만큼이다.
    status-transition-interval: 10s

jwt:
  # Base64 인코딩된 시크릿 (로컬 기본값은 개발용 더미)
  secret-key: ${JWT_SECRET_KEY:bW9tZW50by1sb2NhbC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWU=}
  issuer: ${JWT_ISSUER:momento}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:momento-bucket}
      base-url: ${S3_BASE_URL:https://momento-bucket.s3.ap-northeast-2.amazonaws.com}
    credentials:
      access-key: ${S3_ACCESS_KEY:local-access-key}
      secret-key: ${S3_SECRET_KEY:local-secret-key}
    region:
      static: ap-northeast-2
    stack:
      auto: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

external:
  api-url:
    # 별도 AI 서버 (이미지 생성 등) 연동 주소
    ai: ${EXTERNAL_API_URL_AI:http://localhost:8000}
    # 카카오 API 서버 (액세스 토큰으로 사용자 정보 조회)
    kakao: ${EXTERNAL_API_URL_KAKAO:https://kapi.kakao.com}
    # 카카오 인증 서버 (인가 코드를 액세스 토큰으로 교환)
    kakao-auth: ${EXTERNAL_API_URL_KAKAO_AUTH:https://kauth.kakao.com}

kakao:
  # REST API 키 (프론트가 쓰는 JavaScript 키와 다르다. 로컬 기본값은 개발용 더미)
  client-id: ${KAKAO_CLIENT_ID:local-kakao-rest-api-key}
  # 보안 설정에서 활성화한 경우에만 값을 넣는다
  client-secret: ${KAKAO_CLIENT_SECRET:}
